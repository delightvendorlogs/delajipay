<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091326"><title>Create account · Sparkle SMS</title><link rel="stylesheet" href="sparkle-auth.css"></head><body>
<main class="formwrap"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2.5 24.5 15.5 37.5 20 24.5 24.5 20 37.5 15.5 24.5 2.5 20 15.5 15.5Z" fill="currentColor"/><circle cx="30.5" cy="8.5" r="2.2" fill="#b9f5ff"/></svg></span><span class="brand-word">Sparkle <span class="brand-light">SMS</span></span></a><section class="auth-panel"><div class="eyebrow">GET STARTED</div><h1>Create your Sparkle SMS account</h1><p class="muted">Set up your account to explore supported virtual numbers.</p>

<p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p><p class="legal-links"><a href="index.html">Home</a> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></p></section></main><script type="module" src="auth.js"></script></body></html>
