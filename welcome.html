<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081426"><title>Welcome · BJVERIFY</title><link rel="stylesheet" href="sparkle-auth.css">
