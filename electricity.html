<!doctype html><html lang="en"><head><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230b2638%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%235fe0c3%27%3ED%3C/text%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electricity · DelajiPay</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html">Delaji<span>Pay</span></a><nav class="app-nav" aria-label="Main navigation"><a href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="wallet.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="15" rx="2"/><path d="M2.5 9h19M16 14h2"/></svg><span>Wallet</span></a><a href="transactions.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg><span>History</span></a><a href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a><button class="signout-btn" type="button" data-signout>Sign out</button></nav></header><main class="formwrap"><a href="dashboard.html">← Dashboard</a><section class="panel"><div class="eyebrow">💡 Electricity</div><h1>Pay electricity bill</h1><p class="muted">Check the details carefully. Payment is taken from your wallet balance.</p><form data-kind="electricity"><label>Distribution company<select id="provider" required><option value="">Choose your disco</option><option value="ikeja-electric">Ikeja Electric</option><option value="eko-electric">Eko Electric</option><option value="abuja-electric">Abuja Electric</option><option value="ibadan-electric">Ibadan Electric</option><option value="kano-electric">Kano Electric</option><option value="enugu-electric">Enugu Electric</option><option value="portharcourt-electric">Port Harcourt Electric</option><option value="jos-electric">Jos Electric</option><option value="kaduna-electric">Kaduna Electric</option><option value="benin-electric">Benin Electric</option><option value="yola-electric">Yola Electric</option><option value="aba-electric">Aba Power</option></select></label><label>Meter type<select id="meterType" required><option value="prepaid">Prepaid</option><option value="postpaid">Postpaid</option></select></label><label>Meter number<input id="meter" required inputmode="numeric" placeholder="Enter meter number"></label><div class="verify-row"><button class="btn-ghost" type="button" id="verify-btn">Verify meter</button><span id="verified"></span></div><label>Phone number<input id="phone" required inputmode="numeric" maxlength="11" pattern="0[789][01][0-9]{8}" placeholder="08012345678"></label><label>Amount (₦)<input id="amount" type="number" required min="500" max="500000" inputmode="numeric" placeholder="2000"></label><button class="btn" type="submit">Pay electricity</button></form><div id="purchase-msg" class="purchase-msg" role="status" hidden></div></section></main><footer class="app-footer"><a href="terms.html">Terms and Conditions</a><a href="privacy.html">Privacy Policy</a><a href="support.html">Help & Support</a><a href="dashboard.html">Dashboard</a></footer><script type="module" src="auth.js"></script><script type="module" src="purchase.js"></script></body></html>
